{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div style="max-width:440px; margin:60px auto;">
  <a href="/" style="display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-weight:700;text-decoration:none;font-size:0.85rem;margin-bottom:28px;">← Back</a>

  <div class="card" style="border-color:var(--border-light);">
    <div style="text-align:center; margin-bottom:32px;">
      <span style="font-size:2.4rem; display:block; margin-bottom:12px;">🌸</span>
      <h2 style="font-size:1.5rem; font-weight:900; color:var(--text); letter-spacing:-0.02em;">Welcome Back</h2>
      <p style="color:var(--text-muted); margin-top:6px; font-size:0.9rem;">Sign in to continue your child's practice</p>
    </div>

    <div id="alert-box"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-control" type="email" id="email" required placeholder="name@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative;">
          <input class="form-control" type="password" id="password" required placeholder="••••••••" autocomplete="current-password" style="padding-right:50px;">
          <button type="button" onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:1rem;" title="Show/hide password">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;" id="login-btn">
        Sign In →
      </button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:0.88rem; color:var(--text-muted);">
      New to SpeechBloom?
      <a href="/register/" style="color:var(--crimson); font-weight:800; text-decoration:none;">Create account →</a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn      = document.getElementById('login-btn');
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  if (!email || !password) { showAlert('Please enter your email and password.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    var res = await apiCall('/api/login', 'POST', { email: email, password: password });
    if (res.success) {
      showToast('Welcome back!', 'success');
      setTimeout(function() { window.location.href = res.redirect_url || '/profile/'; }, 700);
    }
  } catch(err) {
    showAlert(err.message, 'error');
    btn.disabled = false; btn.textContent = 'Sign In →';
  }
});
</script>
{% endblock %}
