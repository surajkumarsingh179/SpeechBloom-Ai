services:
  - type: web
    name: speechbloom-ai
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn speechbloom_django.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
